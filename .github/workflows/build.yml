name: Build Monet Theme Service

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Zulu)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload monet-service APK
        uses: actions/upload-artifact@v4
        with:
          name: monet-service-apk
          path: monet-service/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload monet-api AAR
        uses: actions/upload-artifact@v4
        with:
          name: monet-api-aar
          path: monet-api/build/outputs/aar/*.aar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload monet-client AAR
        uses: actions/upload-artifact@v4
        with:
          name: monet-client-aar
          path: monet-client/build/outputs/aar/*.aar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
