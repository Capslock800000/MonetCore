name: Build and Release

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release Assets 上传需要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Zulu)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > monet-service/MonetCoreSignKey.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload monet-service APK
        uses: actions/upload-artifact@v4
        with:
          name: monet-service-apk-signed
          path: monet-service/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload monet-api AAR
        uses: actions/upload-artifact@v4
        with:
          name: monet-api-aar
          path: monet-api/build/outputs/aar/*-release.aar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload monet-client AAR
        uses: actions/upload-artifact@v4
        with:
          name: monet-client-aar
          path: monet-client/build/outputs/aar/*-release.aar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      # ── Release Assets 上传（仅在手动 Release 时触发）──────
      - name: Prepare Release Assets
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p release-assets

          cp monet-service/build/outputs/apk/release/*.apk              "release-assets/MonetCore-Service-${VERSION}.apk"

          cp monet-api/build/outputs/aar/*-release.aar              "release-assets/MonetCore-API-${VERSION}.aar"

          cp monet-client/build/outputs/aar/*-release.aar              "release-assets/MonetCore-Client-${VERSION}.aar"

          ls -la release-assets/

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
